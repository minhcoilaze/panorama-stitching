[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panorama-stitching"
version = "1.0.0"
description = "A modular panorama stitching application with custom DLT/RANSAC and feather blending"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.5",
    "opencv-contrib-python>=4.9,<5.0",
    "Pillow>=10.0,<12.0",
    "streamlit>=1.36,<2.0",
    "threadpoolctl>=3.5,<4.0",
    "numba>=0.65,<0.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
include = ["panorama*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
